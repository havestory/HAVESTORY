kind = "web"
previewPath = "/"
title = "HAVESTORY"
description = "HAVESTORY is a premium Sri Lankan printing & graphic design business platform. It has a full customer-facing website (home, store, services, portfolio, order tracking, about, contact) and a comprehensive admin panel for managing products, orders, clients, invoices, inventory, CRM projects, notices, settings and more."
version = "1.0.0"
id = "artifacts/havestory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20092

[services.development]
run = "pnpm --filter @workspace/havestory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/havestory", "run", "build" ]
serve = "static"
publicDir = "artifacts/havestory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20092"
BASE_PATH = "/"
